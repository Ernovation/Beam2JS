<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Beam2JS server demo</title>
  </head>
  <body>
    <h1>Beam2JS server demo</h1>
    <p>The Erlang modules on this page are compiled from BEAM files by the
      Beam2JS web server when the browser first requests them, including
      <code>ordsets</code> from the OTP installation.</p>
    <form id="form">
      <label>A <input id="a" value="5 3 1 3 7"></label>
      <label>B <input id="b" value="4 1 6 5"></label>
      <button type="submit">Compare with Erlang</button>
    </form>
    <dl id="result"></dl>
    <p id="status" role="status">Loading...</p>
    <script type="module" src="./main.mjs"></script>
  </body>
</html>
